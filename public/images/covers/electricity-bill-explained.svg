  <rect x="650" y="444" width="238" height="32" rx="16" fill="#008751" stroke="#f5b700" stroke-opacity="0.6" stroke-width="1"/>
  <text x="769" y="465" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Updated 9 October 2026</text>

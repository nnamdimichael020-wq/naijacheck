name: Temporary live Worker audit

on:
  push:
    branches: [arena/c6158e8e-naijacheck]
    paths: [.github/workflows/live-audit-temp.yml]

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Crawl unchanged production Worker host
        env:
          LIVE_ORIGIN: https://naijacheck.nnamdimichael020.workers.dev
        run: |
          python3 - <<'PY'
          import html, json, os, re, urllib.error, urllib.parse, urllib.request
          from collections import deque
          origin=os.environ['LIVE_ORIGIN']; canonical='https://naijacheck.ng'
          required=['/','/status','/prices','/trends','/hustle','/tools','/robots.txt','/sitemap.xml','/api/geo']
          queue=deque(required); seen=set(); pages=[]; links_by_page={}; max_pages=500
          def text(raw): return re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',html.unescape(raw))).strip()
          def one(raw, pattern):
            m=re.search(pattern,raw,re.I|re.S); return text(m.group(1)) if m else ''
          while queue and len(seen)<max_pages:
            path=queue.popleft()
            if path in seen: continue
            seen.add(path); url=origin+path
            request=urllib.request.Request(url,headers={'User-Agent':'NaijaCheckReleaseAudit/1.0'})
            try:
              with urllib.request.urlopen(request,timeout=20) as response:
                status=response.status; final=response.url; ctype=response.headers.get('content-type',''); raw=response.read(2_000_000).decode('utf-8','replace')
            except urllib.error.HTTPError as error:
              status=error.code; final=error.url; ctype=error.headers.get('content-type',''); raw=error.read(100_000).decode('utf-8','replace')
            except Exception as error:
              pages.append({'path':path,'error':type(error).__name__+': '+str(error)}); continue
            row={'path':path,'httpStatus':status,'finalUrl':final,'contentType':ctype,'bytes':len(raw.encode()),'title':'','description':'','h1':'','canonical':'','canonicalHost':None,'jsonLdBlocks':0,'freshnessMarkers':[],'externalSourceLinks':[]}
            if 'text/html' in ctype:
              row['title']=one(raw,r'<title[^>]*>(.*?)</title>'); row['h1']=one(raw,r'<h1[^>]*>(.*?)</h1>')
              m=re.search(r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']*)',raw,re.I) or re.search(r'<meta[^>]+content=["\']([^"\']*)["\'][^>]+name=["\']description["\']',raw,re.I)
              row['description']=html.unescape(m.group(1)) if m else ''
              m=re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']*)',raw,re.I) or re.search(r'<link[^>]+href=["\']([^"\']*)["\'][^>]+rel=["\']canonical["\']',raw,re.I)
              row['canonical']=m.group(1) if m else ''; row['canonicalHost']=urllib.parse.urlparse(row['canonical']).netloc or None
              row['jsonLdBlocks']=len(re.findall(r'<script[^>]+type=["\']application/ld\+json',raw,re.I))
              visible=text(raw)
              row['freshnessMarkers']=[x.strip() for x in re.findall(r'.{0,55}(?:source as of|checked:|updated|dated|unverified|stale|seeded|unavailable).{0,90}',visible,re.I)[:8]]
              hrefs=re.findall(r'<a\b[^>]*href=["\']([^"\'#]+)',raw,re.I); normalized=[]; external=[]
              for href in hrefs:
                absolute=urllib.parse.urljoin(origin+path,html.unescape(href)); parsed=urllib.parse.urlparse(absolute)
                if parsed.netloc in (urllib.parse.urlparse(origin).netloc,urllib.parse.urlparse(canonical).netloc):
                  target=parsed.path.rstrip('/') or '/'
                  if not target.startswith('/api/') and not re.search(r'\.(?:png|jpg|jpeg|webp|svg|ico|css|js|json|xml|txt|woff2?)$',target,re.I):
                    normalized.append(target)
                    if target not in seen: queue.append(target)
                elif parsed.scheme in ('http','https'): external.append(absolute)
              links_by_page[path]=sorted(set(normalized)); row['externalSourceLinks']=sorted(set(external))
            pages.append(row)
          status_by_path={page['path']:page.get('httpStatus') for page in pages}
          broken=[{'from':source,'href':target,'status':status_by_path.get(target)} for source,targets in links_by_page.items() for target in targets if status_by_path.get(target,0)>=400 or target not in status_by_path]
          output={'observedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'environment':'live-production-workers.dev','origin':origin,'canonicalConfiguration':canonical,'requiredRoutes':{p:status_by_path.get(p) for p in required},'routesCrawled':len(pages),'brokenInternalLinks':broken,'pages':pages}
          os.makedirs('docs/evidence',exist_ok=True)
          open('docs/evidence/live-worker-crawl-2026-10-10.json','w').write(json.dumps(output,indent=2,ensure_ascii=False)+'\n')
          if any(output['requiredRoutes'].get(p)!=200 for p in required) or broken: raise SystemExit(1)
          PY
      - name: Commit sanitized evidence
        run: |
          git config user.name "naijacheck-audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/live-worker-crawl-2026-10-10.json
          git commit -m "docs: capture production Worker crawl"
          git push origin HEAD:"${GITHUB_REF_NAME}"
